name: Test custom correlator input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake sbt project directory structure
        run: |
          mkdir -p /tmp/fake-sbt-project/project
          echo 'sbt.version=1.9.0' > /tmp/fake-sbt-project/project/build.properties

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/fake-sbt-project
          correlator: my-custom-correlator
          on-resolve-failure: warning
          token: ${{ github.token }}

      - name: Assert action failed at sbt check (not at correlator validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because sbt is not installed, not because of correlator.
          # A failure here means the correlator input was accepted and processing continued.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at sbt check), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted custom correlator and failed at expected point (sbt not installed)"
