name: Test invalid working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a non-sbt directory
        run: mkdir -p /tmp/not-an-sbt-project

      - id: action
        uses: .
        with:
          working-directory: /tmp/not-an-sbt-project
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed due to missing project folder
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when working directory has no 'project' folder"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid working directory"
