name: Test basic sbt dependency submission - invalid working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: '12345'
      GITHUB_API_URL: https://api.github.com
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory without a project folder
        run: mkdir -p /tmp/not-an-sbt-project

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/not-an-sbt-project
          token: fake-token-for-testing

      - name: Assert action failed due to missing project folder
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when working directory has no 'project' folder, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when working directory has no 'project' folder"
