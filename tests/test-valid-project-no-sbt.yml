name: Test valid sbt project structure without sbt installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal sbt project structure
        run: |
          mkdir -p /tmp/sbt-project/project
          echo 'sbt.version=1.9.0' > /tmp/sbt-project/project/build.properties
          echo 'name := "test-project"' > /tmp/sbt-project/build.sbt

      - name: Ensure sbt is not installed
        run: |
          which sbt && echo "sbt found, test may not behave as expected" || echo "sbt not found, as expected"

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/sbt-project
          on-resolve-failure: warning
          token: fake-token-for-testing

      - name: Assert action failed at sbt execution (not at project validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because sbt is not installed (not because of missing project dir)
          # This confirms the action passed the project directory validation
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (sbt not installed), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at sbt execution stage (project dir validation passed)"
