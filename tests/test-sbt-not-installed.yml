name: Test sbt not installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake sbt project directory structure
        run: |
          mkdir -p /tmp/fake-sbt-project/project
          echo 'sbt.version=1.9.0' > /tmp/fake-sbt-project/project/build.properties

      - name: Ensure sbt is not on PATH
        run: |
          if command -v sbt >/dev/null 2>&1; then
            echo "sbt is already installed at $(which sbt), test may not be valid"
          else
            echo "sbt is not installed, proceeding with test"
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/fake-sbt-project
          on-resolve-failure: warning
          token: ${{ github.token }}

      - name: Assert action failed because sbt is not available
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when sbt is not installed, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when sbt is not installed"
