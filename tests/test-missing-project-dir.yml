name: Test missing project directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a temp working directory without a project folder
        run: mkdir -p /tmp/fake-sbt-root

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/fake-sbt-root
          token: ${{ github.token }}

      - name: Assert action failed due to missing project directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when project directory is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when project directory is missing"
