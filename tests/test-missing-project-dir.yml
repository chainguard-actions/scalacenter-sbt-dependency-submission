name: Test missing project directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a committed fixture directory that has no 'project/' subdirectory.
      # The action should fail because the sbt project directory is missing.
      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/tests/fixtures/no-project
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed due to missing project directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when project directory is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when project directory is missing"
