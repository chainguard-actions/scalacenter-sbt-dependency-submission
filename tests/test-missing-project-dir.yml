name: Test missing project directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a temp working directory without a project folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/not-an-sbt-project"
          echo "This is not an sbt project" > "$GITHUB_WORKSPACE/tests/fixtures/not-an-sbt-project/README.md"

      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/not-an-sbt-project
        continue-on-error: true

      - name: Assert action failed due to missing project directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when project directory is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when project directory is missing"
