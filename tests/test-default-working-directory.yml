name: Test default working directory with no sbt project at workspace root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The workspace root has no 'project/' directory, so the action should
      # fail with a "missing folder" error. We pass the workspace root
      # explicitly to ensure the action uses it regardless of its default CWD.
      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed because workspace root has no project directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no project/ at workspace root), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no project/ directory exists at workspace root"
