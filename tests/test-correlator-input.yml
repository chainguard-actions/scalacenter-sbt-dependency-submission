name: Test custom correlator input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal sbt project structure and fake sbt
        run: |
          mkdir -p /tmp/sbt-project-correlator/project
          echo 'sbt.version=1.9.7' > /tmp/sbt-project-correlator/project/build.properties

          # Create a fake sbt that captures its arguments for inspection
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/sbt << 'SBTEOF'
          #!/bin/sh
          echo "fake sbt args: $@" > /tmp/sbt-correlator-args.txt
          echo "fake sbt called successfully"
          exit 0
          SBTEOF
          chmod +x /tmp/fake-bin/sbt
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          working-directory: /tmp/sbt-project-correlator
          correlator: my-custom-correlator
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action succeeded and correlator was passed to sbt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with custom correlator and fake sbt"
            exit 1
          fi

          echo "sbt args captured:"
          cat /tmp/sbt-correlator-args.txt

          # Verify the sbt args contain the custom correlator
          if ! grep -q "my-custom-correlator" /tmp/sbt-correlator-args.txt; then
            echo "FAIL: expected custom correlator 'my-custom-correlator' in sbt args"
            exit 1
          fi
          echo "PASS: custom correlator was correctly passed to sbt"
