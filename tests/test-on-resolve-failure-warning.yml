name: Test on-resolve-failure warning mode - missing sbt binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: '12345'
      GITHUB_API_URL: https://api.github.com
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal sbt project structure
        run: |
          mkdir -p /tmp/sbt-warn-test/project
          echo 'sbt.version=1.9.7' > /tmp/sbt-warn-test/project/build.properties
          echo 'ThisBuild / scalaVersion := "2.13.12"' > /tmp/sbt-warn-test/build.sbt

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/sbt-warn-test
          on-resolve-failure: warning
          token: fake-token-for-testing

      - name: Assert action failed because sbt is not installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when sbt is not installed, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when sbt is not installed"
