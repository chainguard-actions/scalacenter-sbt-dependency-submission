name: Test on-resolve-failure warning value is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a committed fixture directory without a 'project/' subdirectory.
      # The action will fail because the project directory is missing — this
      # is expected and guarantees a deterministic failure regardless of
      # whether sbt is installed. The on-resolve-failure=warning input is
      # passed to verify it is a valid value that does not cause early
      # rejection (only 'error' and 'warning' are valid).
      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/tests/fixtures/no-project
          on-resolve-failure: warning
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed (missing project directory, not on-resolve-failure error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing project/), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed; on-resolve-failure=warning did not cause early validation error"
