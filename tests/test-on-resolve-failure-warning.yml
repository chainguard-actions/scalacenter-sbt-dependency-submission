name: Test on-resolve-failure warning mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal sbt project
        run: |
          mkdir -p /tmp/sbt-warn-project/project
          echo 'sbt.version=1.9.7' > /tmp/sbt-warn-project/project/build.properties
          echo 'name := "warn-test"' > /tmp/sbt-warn-project/build.sbt
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/sbt-warn-project
          on-resolve-failure: warning
          modules-ignore: foo_2.13 bar_2.13
          configs-ignore: test scala-doc-tool
          token: fake-token
      - name: Assert action accepted valid on-resolve-failure warning value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail due to invalid on-resolve-failure value.
          # It may fail because sbt is not installed, but 'warning' is a valid value.
          # We verify it did not fail at the on-resolve-failure validation step
          # by checking the action ran (any outcome is acceptable here).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted on-resolve-failure=warning (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
