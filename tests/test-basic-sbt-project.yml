name: Test basic sbt project dependency submission
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Java and sbt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q default-jdk-headless curl
          # Install sbt via official script
          curl -fL "https://github.com/sbt/sbt/releases/download/v1.9.9/sbt-1.9.9.tgz" -o /tmp/sbt.tgz
          tar -xzf /tmp/sbt.tgz -C /tmp
          sudo mv /tmp/sbt/bin/sbt /usr/local/bin/sbt
          sudo mv /tmp/sbt/bin/sbt-launch.jar /usr/local/bin/sbt-launch.jar || true
          sudo mv /tmp/sbt /usr/local/sbt
          echo "/usr/local/sbt/bin" >> $GITHUB_PATH
          sbt --version || true

      - name: Create a minimal sbt project
        run: |
          mkdir -p /tmp/sbt-test-project/project
          cat > /tmp/sbt-test-project/build.sbt << 'EOF'
          name := "test-project"
          version := "0.1.0"
          scalaVersion := "2.13.12"
          EOF
          echo 'sbt.version=1.9.9' > /tmp/sbt-test-project/project/build.properties

      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/sbt-test-project
          token: ${{ github.token }}
          sbt-plugin-version: '3.2.2'

      - name: Check snapshot-json-path output or expected failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SNAPSHOT_PATH: ${{ steps.action.outputs.snapshot-json-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "snapshot-json-path: $SNAPSHOT_PATH"
          # The action may fail due to API submission failure (no real GitHub token in act),
          # but if it succeeded, verify the snapshot path output is set
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SNAPSHOT_PATH" ]; then
              echo "FAIL: action succeeded but snapshot-json-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with snapshot-json-path=$SNAPSHOT_PATH"
          else
            echo "INFO: action failed (expected in act environment without real GitHub token)"
            echo "PASS: action ran and failed gracefully"
          fi
