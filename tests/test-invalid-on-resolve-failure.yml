name: Test invalid on-resolve-failure input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal sbt project structure and fake sbt
        run: |
          mkdir -p /tmp/sbt-project-invalid/project
          echo 'sbt.version=1.9.7' > /tmp/sbt-project-invalid/project/build.properties

          # Create a fake sbt so the action can reach the on-resolve-failure validation
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/sbt << 'SBTEOF'
          #!/bin/sh
          echo "fake sbt called with args: $@"
          exit 0
          SBTEOF
          chmod +x /tmp/fake-bin/sbt
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          working-directory: /tmp/sbt-project-invalid
          on-resolve-failure: invalid-value
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed due to invalid on-resolve-failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when on-resolve-failure is invalid"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid on-resolve-failure value"
