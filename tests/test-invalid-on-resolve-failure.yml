name: Test invalid on-resolve-failure input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a committed fixture with a valid sbt project structure.
      # The action should fail because on-resolve-failure=invalid-value is not
      # a valid value (must be 'error' or 'warning'). If sbt is not installed,
      # the action will fail at the sbt check instead — either way it fails.
      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/tests/fixtures/sbt-project
          on-resolve-failure: invalid-value
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed due to invalid on-resolve-failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid on-resolve-failure, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid on-resolve-failure value"
